document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0px;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html{scroll-behavior:smooth}\n  body{\n    font-family:'Hanken Grotesk',sans-serif;\n    background:var(--bg);color:var(--ink);\n    -webkit-font-smoothing:antialiased;\n    line-height:1.5;\n  }\n  .mono{font-family:'Space Mono',monospace;}\n  a{color:inherit;}\n  ::selection{background:var(--lime);color:var(--ink);}\n\n  /* signature stripe */\n  .stripe{position:fixed;top:0;left:0;right:0;height:8px;display:flex;z-index:200;}\n  .stripe i{flex:1;}\n  .stripe i:nth-child(1){background:var(--teal);}\n  .stripe i:nth-child(2){background:var(--coral);}\n  .stripe i:nth-child(3){background:var(--lime);}\n  .stripe i:nth-child(4){background:var(--teal);}\n  .stripe i:nth-child(5){background:var(--bright);}\n\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;}\n\n  /* ===== top nav ===== */\n  header.nav{position:sticky;top:8px;z-index:150;background:rgba(241,239,232,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}\n  .nav-in{display:flex;align-items:center;justify-content:space-between;height:84px;}\n  .brand{display:flex;align-items:center;gap:18px;}\n  .brand img{height:34px;display:block;}\n  .brand .div{width:1px;height:30px;background:var(--line2);}\n  .brand .prog{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.3;}\n  .brand .prog b{color:var(--green);font-weight:700;}\n  .nav-meta{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}\n  .nav-links{display:flex;gap:30px;align-items:center;}\n  .nav-links a{font-size:16px;font-weight:600;color:var(--muted);text-decoration:none;transition:color .15s;position:relative;white-space:nowrap;}\n  .nav-links a:hover{color:var(--ink);}\n  .nav-links a.active{color:var(--green);}\n  .nav-links a.active::after{content:\"\";position:absolute;left:0;right:0;bottom:-30px;height:3px;background:var(--green);}\n  @media(max-width:820px){.nav-links{display:none;}}\n\n  /* ===== hero (sub-page) ===== */\n  .hero{padding:40px 0 50px;border-bottom:1px solid var(--line);}\n  .crumb{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;gap:11px;align-items:center;flex-wrap:wrap;}\n  .crumb a{text-decoration:none;color:var(--faint);transition:color .15s;}\n  .crumb a:hover{color:var(--green);}\n  .crumb .sep{opacity:.45;}\n  .crumb .cur{color:var(--green);font-weight:700;}\n  .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:70px;align-items:center;margin-top:36px;}\n  @media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:44px;}}\n  .eyebrow{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--bright);display:inline-flex;align-items:center;gap:12px;}\n  .eyebrow::before{content:\"\";width:9px;height:9px;border-radius:50%;background:var(--gold);}\n  h1.hero-title{font-size:clamp(36px,4.3vw,60px);font-weight:800;line-height:1.02;letter-spacing:-.022em;margin-top:20px;max-width:15ch;}\n  h1.hero-title em{font-style:normal;color:var(--bright);}\n  .hero-sub{font-size:clamp(17px,1.3vw,20px);color:var(--muted);font-weight:500;max-width:54ch;margin-top:22px;line-height:1.5;}\n\n  .statline{display:flex;flex-wrap:wrap;gap:0;margin-top:38px;}\n  .statline .s{padding-right:30px;margin-right:30px;border-right:1px solid var(--line2);}\n  .statline .s:last-child{border-right:none;margin-right:0;padding-right:0;}\n  .statline .n{font-size:40px;font-weight:800;letter-spacing:-.025em;line-height:1;}\n  .statline .l{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:9px;line-height:1.35;}\n  .statline .s:nth-child(1) .n{color:var(--green);}\n  .statline .s:nth-child(2) .n{color:var(--coral);}\n  .statline .s:nth-child(3) .n{color:var(--teal);}\n  .statline .s: x solid var(--line2);border-radius:12px;padding:4px;gap:2px;}\n  .seg button{border:none;background:none;font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap;transition:all .15s;}\n  .seg button:hover{color:var(--ink);}\n  .seg button.on{background:var(--green);color:#fff;}\n\n  .selwrap{position:relative;}\n  select.sortsel{appearance:none;font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:0 38px 0 16px;height:50px;color:var(--muted);cursor:pointer;}\n  .selwrap::after{content:\"▾\";position:absolute;right:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint);font-size:12px;}\n\n  /* state filter row */\n  .statefilter{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;}\n  .sf-label{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:4px;}\n  .pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:8px 16px 8px 12px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink);}\n  .pill .dot{width:11px;height:11px;border-radius:50%;flex:none;}\n  .pill .ct{font-family:'Space Mono',monospace;font-size:12px;color:var(--faint);}\n  .pill:hover{border-color:var(--line2);transform:translateY(-1px);}\n  .pill.on{color:#fff;border-color:transparent;}\n  .pill.on .ct{color:rgba(255,255,255,.75);}\n\n  /* ===== results meta ===== */\n  .resbar{display:flex;align-items:baseline;justify-content:space-between;padding:34px 0 22px;}\n  .resbar .count{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}\n  .resbar .count b{color:var(--ink);}\n  .clearbtn{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:none;border:none;color:var(--coral);cursor:pointer;display:none;}\n  .clearbtn.show{display:inline;}\n\n  /* ===== grid ===== */\n  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:90px;}\n  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr);}}\n  @media(max-width:720px){.grid{grid-template-columns:1fr;}}\n\n  .card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 28px 26px;cursor:pointer;display:flex;flex-direction:column;min-height:268px;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;overflow:hidden;}\n  .card::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);transform:scaleY(0);transform-origin:top;transition:transform .22s cubic-bezier(.2,.7,.3,1);}\n  .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(20,33,25,.35);border-color:var(--line2);}\n  .card:hover::before{transform:scaleY(1);}\n  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}\n  .state-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}\n  .state-tag .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;}\n  .track-badge{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding:5px 11px;border-radius:999px;font-weight:700;}\n  .track-badge.acc{background:rgba(20,60,43,.08);color:var(--green2);}\n  .track-badge.inc{background:rgba(232,93,61,.12);color:var(--coral);}\n  .card h3{font-size:27px;font-weight:800;letter-spacing:-.018em;line-height:1.05;}\n  .card .sector{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em;color:var(--c);margin-top:9px;font-weight:700;}\n  .card .summ{font-size:16px;color:var(--muted);line-height:1.46;margin-top:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}\n  .card-foot{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between;}\n  .traction{font-size:12.5px;font-family:'Space Mono',monospace;letter-spacing:.02em;color:var(--green2);background:rgba(43,168,74,.1);padding:6px 11px;border-radius:8px;line-height:1.3;max-width:74%;}\n  .card .arrow{font-size:20px;color:var(--faint);margin-left:auto;transition:transform .18s,color .18s;}\n  .card:hover .arrow{transform:translateX(4px);color:var(--c);}\n  .card-icons{display:flex;gap:9px;align-items:center;}\n  .ci{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}\n  .ci svg{width:13px;height:13px;}\n\n  .empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--faint);font-size:19px;}\n\n  /* ===== detail overlay ===== */\n  .overlay{position:fixed;inset:0;z-index:300;background:rgba(20,25,20,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;justify-content:flex-end;}\n  .overlay.open{opacity:1;pointer-events:auto;}\n  .panel{width:min(620px,92vw);background:var(--paper);height:100%;overflow-y:auto;transform:translateX(40px);transition:transform .32s cubic-bezier(.2,.8,.25,1);box-shadow:-30px 0 80px -30px rgba(0,0,0,.45);}\n  .overlay.open .panel{transform:none;}\n  .panel-band{padding:34px 44px 30px;color:#fff;position:relative;}\n  .panel-band .closeb{position:absolute;top:26px;right:28px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}\n  .panel-band .closeb:hover{background:rgba(255,255,255,.22);}\n  .panel-band .p-track{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;}\n  .panel-band h2{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.02;margin-top:14px;max-width:13ch;}\n  .panel-band .p-sector{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:.04em;margin-top:14px;opacity:.92;}\n  .panel-body{padding:34px 44px 56px;}\n  .p-meta{display:flex;gap:34px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px;}\n  .p-meta .mi{display:flex;flex-direction:column;gap:6px;}\n  .p-meta .mk{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}\n  .p-meta .mv{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}\n  .p-meta .mv .dot{width:11px;height:11px;border-radius:50%;}\n  .p-traction{background:var(--green);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:28px;}\n  .p-traction .k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);}\n  .p-traction .v{font-size:21px;font-weight:700;margin-top:7px;letter-spacing:-.01em;}\n  .p-desc{font-size:18px;line-height:1.62;color:#2C281F;}\n\n  /* milestones & updates */\n  .p-updates{margin-top:34px;padding-top:30px;border-top:1px solid var(--line);}\n  .p-updates h4{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}\n  .p-updates ul{list-style:none;}\n  .p-updates li{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.4;color:#2C281F;}\n  .p-updates li:last-child{border-bottom:none;}\n  .p-updates .ud{margin-top:.5em;width:8px;height:8px;border-radius:50%;background:var(--bright);flex:none;}\n\n  /* action buttons */\n  .p-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:
